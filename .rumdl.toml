# rumdl configuration file

[global]
exclude = [".git", "target"]
flavor = "gfm"
output-format = "grouped"

[MD033]
allowed-elements = ["br"]

[MD013]
code-blocks = true
headings = true
line-length = 120
paragraphs = true
reflow = true
reflow-mode = "normalize"
strict = false
tables = false

[MD041]
front-matter-title = "name"
