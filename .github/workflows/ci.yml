name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          brew install clang-format
          files=$(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc')
          if [ -z "$files" ]; then
            echo "No C/C++ sources to lint."
            exit 0
          fi
          clang-format --dry-run --Werror $files

  build:
    runs-on: macos-26
    needs: lint
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vendor/vcpkg
      # GitHub Actions cache backend for vcpkg binary cache.
      # See https://learn.microsoft.com/en-us/vcpkg/users/binarycaching#gha
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Required by VCPKG_BINARY_SOURCES=x-gha — exposes
      # ACTIONS_CACHE_URL / ACTIONS_RUNTIME_TOKEN to vcpkg.
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/get-cmake@latest
      - name: Install brew tools (LLVM ≥ 21, xcodegen)
        run: brew install llvm xcodegen
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}-${{ runner.arch }}-macos-debug
          max-size: 1G
      - name: Bootstrap vcpkg
        run: ./vendor/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: vcpkg install test deps (fory_overlay_port_resolves)
        # Install fory + catch2 in classic mode so the cmake configure step finds
        # Fory::fory and Catch2 for the tests/data/pkg smoke test (refs #218).
        # Classic mode is used because manifest mode would attempt to resolve all
        # vcpkg.json deps including ports not yet authored (metal-cpp, etc.).
        run: |
          ./vendor/vcpkg/vcpkg install \
            fory:arm64-osx \
            catch2:arm64-osx \
            --classic \
            --overlay-ports=vcpkg-overlay-ports
      - name: Configure
        run: |
          cmake --preset macos-debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset macos-debug
      - name: Test
        run: ctest --preset macos-debug

  spec-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify acceptance ↔ test mapping
        run: 'true  # TODO: enable once tooling lands'

  e2e-core:
    # TEMPORARILY DISABLED — re-enable once `glibre-trace` CLI lands.
    # See specs/e2e/SPEC.md §6.5 + sdlc.md §5 for the closure-gate contract.
    # Original `if: always()` preserved below; flip `if: false` → `if: always()`
    # to restore the correct-red behavior.
    runs-on: macos-14
    needs: build
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate e2e/core traces
        id: list
        run: |
          set -euo pipefail
          traces=$(git ls-files 'tests/e2e/core/*.glibre-trace' || true)
          if [ -z "$traces" ]; then
            echo "ERROR: no .glibre-trace files found under tests/e2e/core/ — at least one trace must be present" >&2
            exit 1
          fi
          {
            echo 'traces<<EOF'
            echo "$traces"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Replay e2e/core traces
        run: |
          set -euo pipefail
          # `glibre-trace` is the §6.5 CLI; until tools/cli/glibre-trace
          # lands the runner is absent and this step exits non-zero —
          # which IS the contract (specs/e2e/SPEC.md §5 / sdlc.md §5).
          if ! command -v glibre-trace >/dev/null 2>&1; then
            echo "glibre-trace runner not yet built — see specs/e2e/SPEC.md §6.5" >&2
            echo "trace stories pending implementation:" >&2
            printf '%s\n' "${{ steps.list.outputs.traces }}" >&2
            exit 1
          fi
          while IFS= read -r trace; do
            [ -n "$trace" ] || continue
            echo "::group::replay $trace"
            glibre-trace replay --trace "$trace" --layer inproc
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.traces }}"

  dep-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify task issue dependencies closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: 'true  # TODO: enable once tooling lands'

  e2e-shader:
    # TEMPORARILY DISABLED — re-enable once `glibre-trace` CLI lands.
    # Mirrors e2e-core gating; flip `if: false` → `if: always()` to restore.
    runs-on: macos-14
    needs: build
    if: false
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate e2e/shader traces
        id: list
        run: |
          set -euo pipefail
          traces=$(git ls-files 'tests/e2e/shader/*.glibre-trace' || true)
          if [ -z "$traces" ]; then
            echo "ERROR: no .glibre-trace files found under tests/e2e/shader/ — at least one trace must be present" >&2
            exit 1
          fi
          {
            echo 'traces<<EOF'
            echo "$traces"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Replay e2e/shader traces
        run: |
          set -euo pipefail
          # `glibre-trace` is the §6.5 CLI; until tools/cli/glibre-trace
          # lands the runner is absent and this step exits non-zero —
          # which IS the contract (specs/e2e/SPEC.md §5 / sdlc.md §5).
          if ! command -v glibre-trace >/dev/null 2>&1; then
            echo "glibre-trace runner not yet built — see specs/e2e/SPEC.md §6.5" >&2
            echo "trace stories pending implementation:" >&2
            printf '%s\n' "${{ steps.list.outputs.traces }}" >&2
            exit 1
          fi
          while IFS= read -r trace; do
            [ -n "$trace" ] || continue
            echo "::group::replay $trace"
            glibre-trace replay --trace "$trace" --layer inproc
            echo "::endgroup::"
          done <<< "${{ steps.list.outputs.traces }}"
