name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install rumdl
        run: pip install rumdl
      - name: rumdl check
        run: rumdl check .

  cargo-check:
    # Workspace is currently empty (members = []) per /go coding lockout.
    # cargo metadata succeeds and is the gate against accidental drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo metadata
        run: cargo metadata --format-version 1 > /dev/null
      - name: cargo check (workspace)
        run: cargo check --workspace --all-targets || test "$(cargo metadata --format-version 1 | jq '.workspace_members | length')" = "0"

  spec-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPEC.md scaffolds present for every context
        run: |
          set -euo pipefail
          missing=0
          for ctx in core-runtime platform rendering physics audio input geometry animation ai vfx ui networking data-systems simulation content-pipeline game-framework tools integration; do
            if [ ! -f "specs/$ctx/SPEC.md" ]; then
              echo "missing specs/$ctx/SPEC.md" >&2
              missing=1
            fi
          done
          exit $missing
