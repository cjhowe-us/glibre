name: dod-verify
on:
  issues:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: dod-verify-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  verify:
    # Skip bots, the verifier's own comments, and irrelevant comment events.
    if: >-
      (github.event_name == 'issues' &&
       contains(join(github.event.issue.labels.*.name, ','), 'type:plan') ||
       contains(join(github.event.issue.labels.*.name, ','), 'type:spike') ||
       contains(join(github.event.issue.labels.*.name, ','), 'type:user-story'))
      ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.state == 'closed' &&
       contains(github.event.comment.body, '/verify-dod'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Fetch issue body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The webhook payload truncates large bodies; re-fetch via API.
          gh issue view "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --json body --jq .body > /tmp/issue-body.md
          {
            echo 'body<<DOD_EOF'
            cat /tmp/issue-body.md
            echo
            echo 'DOD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run verifier
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          set +e
          python3 .github/scripts/verify_dod.py > /tmp/verdict.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'verdict<<DOD_EOF'
            cat /tmp/verdict.md
            echo
            echo 'DOD_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "${{ steps.verify.outputs.verdict }}"

      - name: Reopen on failure
        if: steps.verify.outputs.rc != '0' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue reopen "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "DoD verifier failed — reopening. Address the failures above and re-close (or comment \`/verify-dod\`)."
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "dod:failed" --remove-label "dod:verified" || true

      - name: Tag verified on success
        if: steps.verify.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "dod:verified" --remove-label "dod:failed" || true
