name: Plan
description: Leaf implementation unit. Carries a unit test plan.
title: "[PLAN] "
labels: ["type:plan"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points (Fibonacci, > 8 must split)
      options: [ "pts:1", "pts:2", "pts:3", "pts:5", "pts:8" ]
    validations: { required: true }
  - type: textarea
    id: stories
    attributes:
      label: User Stories Satisfied
      description: GitHub `#NNN` refs to type:user-story issues.
    validations: { required: true }
  - type: input
    id: parent
    attributes:
      label: Parent (Epic or Sub-Epic)
      placeholder: "#42"
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Single SRP scope. What changes; what does not.
    validations: { required: true }
  - type: textarea
    id: unit-tests
    attributes:
      label: Unit Test Plan
      description: Catch2 test names this plan adds or updates. ≥1 required.
      placeholder: |
        - core/world: archetype_transition_o1
        - core/world: change_tick_increments_on_set
    validations: { required: true }
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: |
        Machine-checkable assertions that must all hold against `main` before
        the issue may be closed. The `dod-verify` GitHub Action parses the
        fenced YAML block below; one assertion per list entry. Supported
        keys (see `.github/DOD-DSL.md`):
          - file_exists: <path>
          - file_contains: { path: <p>, regex: <re> }
          - glob_nonempty: <pattern>
          - pr_merged_closes_self: true   (≥1 merged PR closes this issue)
          - workflow_passed: <workflow filename or name>
          - unit_test_named: <Catch2 test name>     (must appear in tests/)
          - issue_comment_matches: <regex>          (manual-pass / trace-pass)
        The verifier evaluates with the repo checked out at `main`; assertions
        run as pure shell, no project build required.
      value: |
        ```yaml
        # Required for every plan: at least one merged PR that closes this issue.
        - pr_merged_closes_self: true
        # Add file/glob/test assertions specific to this plan's deliverable:
        # - file_exists: <relative path under repo root>
        # - unit_test_named: <Catch2 test name added by this plan>
        ```
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: "- #1"
  - type: textarea
    id: agent-notes
    attributes:
      label: Agent Execution Notes
      description: |
        Subagents post status comments here in English.
        PRs use Conventional Commit subjects (feat / fix / test / refactor / etc.).
