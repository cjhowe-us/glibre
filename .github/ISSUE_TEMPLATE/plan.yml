name: Plan
description: Leaf unit that closes with exactly one PR.
title: "[PLAN] "
labels: ["type:plan"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points (Fibonacci, > 5 should split — 1 PR target)
      options: [ "pts:1", "pts:2", "pts:3", "pts:5" ]
    validations: { required: true }
  - type: textarea
    id: stories
    attributes:
      label: User Stories Satisfied
      description: GitHub `#NNN` refs to type:user-story issues.
    validations: { required: true }
  - type: input
    id: parent
    attributes:
      label: Parent (Epic or Sub-Epic)
      placeholder: "#42"
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Single SRP slice. Closes with exactly one PR.
    validations: { required: true }
  - type: input
    id: pr-subject
    attributes:
      label: Conventional Commit Subject
      placeholder: "feat(core): add Plugin manifest type"
    validations: { required: true }
  - type: textarea
    id: unit-tests
    attributes:
      label: Unit Test Plan
      description: Catch2 test names this plan adds or updates. ≥1 required.
      placeholder: |
        - core/world: archetype_transition_o1
        - core/world: change_tick_increments_on_set
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: "- #1"
  - type: textarea
    id: agent-notes
    attributes:
      label: Agent Execution Notes
