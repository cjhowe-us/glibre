name: Epic
description: Milestone-scale slice for one bounded context.
title: "[EPIC] "
labels: ["type:epic"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: input
    id: context
    attributes:
      label: Bounded Context
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What "done" means for this epic.
    validations: { required: true }
  - type: textarea
    id: tasks
    attributes:
      label: Sub-tasks
      description: Will be tracked via GitHub native sub-issues.
  - type: textarea
    id: stories
    attributes:
      label: User Stories Covered
