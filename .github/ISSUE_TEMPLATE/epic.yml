name: Epic
description: Aggregator under an initiative. No own estimate; rolls up from leaves.
title: "[EPIC] "
labels: ["type:epic"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent Initiative
      placeholder: "#42"
    validations: { required: true }
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Single SRP slice. What changes; what does not.
    validations: { required: true }
  - type: textarea
    id: stories
    attributes:
      label: User Stories Covered
      description: GitHub `#NNN` refs to type:user-story issues.
  - type: textarea
    id: children
    attributes:
      label: Child Issues
      description: Sub-epics, plans, or spikes.
      placeholder: |
        - [ ] #100  type:sub-epic
        - [ ] #101  type:plan
        - [ ] #102  type:spike
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: "- #1\n- #5"
  - type: textarea
    id: agent-notes
    attributes:
      label: Agent Execution Notes
      description: |
        Subagents post status comments here in English:
        `agent:<name> status:<started|progress|blocked|done> child:#N notes:<…>`.
