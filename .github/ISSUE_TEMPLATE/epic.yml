name: Epic
description: Multi-PR work item under a tracking issue.
title: "[EPIC] "
labels: ["type:epic"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points (Fibonacci, > 8 must split)
      options: [ "pts:1", "pts:2", "pts:3", "pts:5", "pts:8" ]
    validations: { required: true }
  - type: textarea
    id: stories
    attributes:
      label: User Stories Satisfied
      description: GitHub `#NNN` refs to type:user-story issues.
    validations: { required: true }
  - type: input
    id: parent
    attributes:
      label: Parent Tracking Issue
      placeholder: "#42"
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Single SRP slice. What changes; what does not.
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      placeholder: "- #1\n- #5"
  - type: textarea
    id: pr-plan
    attributes:
      label: PR Plan
      description: Granular Conventional Commit PRs intended to close this epic.
      placeholder: |
        - feat(core): add Plugin manifest type
        - test(core): manifest round-trip
  - type: textarea
    id: agent-notes
    attributes:
      label: Agent Execution Notes
      description: |
        Subagents post status comments here in English:
        `agent:<name> status:<started|progress|blocked|done> notes:<…>`.
