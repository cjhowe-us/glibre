name: Initiative
description: Top-level aggregator. Groups epics. No own estimate.
title: "[INIT] "
labels: ["type:initiative"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: "e.g. MVP / rendering pillar, Post-MVP / virtualized geometry"
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Closure criteria.
    validations: { required: true }
  - type: textarea
    id: epics
    attributes:
      label: Child Epics
      description: |
        GitHub native sub-issues. This initiative carries no estimate.
      placeholder: |
        - [ ] #12  type:epic
        - [ ] #13  type:epic
  - type: textarea
    id: progress-log
    attributes:
      label: Progress Log
      description: |
        Subagents post status comments here in English:
        `agent:<name> status:<started|progress|blocked|done> child:#N notes:<…>`.
