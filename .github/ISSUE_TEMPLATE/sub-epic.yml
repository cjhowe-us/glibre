name: Sub-Epic
description: Nested aggregator under an epic. No own estimate; rolls up.
title: "[SUB-EPIC] "
labels: ["type:sub-epic"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent Epic
      placeholder: "#42"
    validations: { required: true }
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
    validations: { required: true }
  - type: textarea
    id: children
    attributes:
      label: Child Issues
      description: Plans, spikes, or further sub-epics.
      placeholder: |
        - [ ] #100  type:plan
        - [ ] #101  type:spike
  - type: textarea
    id: progress-log
    attributes:
      label: Progress Log
