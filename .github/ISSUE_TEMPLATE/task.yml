name: Task
description: Unit of implementation work satisfying ≥1 user story.
title: "[TASK] "
labels: ["type:task"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points (Fibonacci, > 8 must split)
      options: [ "pts:1", "pts:2", "pts:3", "pts:5", "pts:8" ]
    validations: { required: true }
  - type: textarea
    id: stories
    attributes:
      label: User Stories Satisfied
      description: List `#NNN` issue refs to `type:user-story` issues.
      placeholder: |
        - #12
        - #34
    validations: { required: true }
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this task changes. Single SRP slice.
    validations: { required: true }
  - type: textarea
    id: dependencies
    attributes:
      label: Depends on
      description: GitHub native issue dependencies. Topological order required.
      placeholder: "- #1\n- #5"
  - type: textarea
    id: pr-plan
    attributes:
      label: PR Plan
      description: Granular conventional-commit PRs intended to close this task.
      placeholder: |
        - feat(core): add Plugin manifest type
        - feat(core): wire dlopen loader
        - test(core): manifest round-trip
