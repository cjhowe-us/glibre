name: Tracking Issue
description: Non-leaf aggregator. No own estimate. Aggregates epics / plans / spikes / other tracking issues.
title: "[TRACK] "
labels: ["type:tracking"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: input
    id: scope
    attributes:
      label: Scope
      placeholder: "e.g. MVP / render, plan-001 execution, iteration-1 review"
    validations: { required: true }
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What "done" means; closure criteria.
    validations: { required: true }
  - type: textarea
    id: children
    attributes:
      label: Child Issues
      description: |
        GitHub native sub-issues. Parent's story-point total is the sum of
        leaf children. Do not put an estimate on this issue.
      placeholder: |
        - [ ] #12  user-story  pts:3
        - [ ] #13  task-exec   pts:5
  - type: textarea
    id: progress-log
    attributes:
      label: Progress Log
      description: |
        Subagents post structured comments here in English as they execute:
        `agent:<name> status:<started|done|blocked> issue:#N notes:<…>`.
        This issue is the source of truth for plan execution progress.
