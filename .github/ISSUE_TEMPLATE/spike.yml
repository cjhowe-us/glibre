name: Spike
description: Time-boxed research or design exploration. Output is a doc / decision / prototype.
title: "[SPIKE] "
labels: ["type:spike"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
        - infra
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: textarea
    id: question
    attributes:
      label: Question
    validations: { required: true }
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Doc path, decision record, or prototype branch.
    validations: { required: true }
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: |
        Machine-checkable assertions that must all hold against `main` before
        the issue may be closed. Parsed by the `dod-verify` GitHub Action.
        See `.github/DOD-DSL.md` for the supported assertion grammar.
      value: |
        ```yaml
        - pr_merged_closes_self: true
        # Spike deliverable usually a doc — assert its presence on main:
        # - file_exists: specs/<context>/<topic>-design.md
        # - file_contains:
        #     path: specs/<context>/<topic>-design.md
        #     regex: "^## 1\\. Purpose"
        ```
    validations: { required: true }
  - type: input
    id: parent
    attributes:
      label: Parent (Epic or Sub-Epic)
      placeholder: "#42"
    validations: { required: true }
  - type: textarea
    id: agent-notes
    attributes:
      label: Agent Execution Notes
