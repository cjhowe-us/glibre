name: Spike
description: Time-boxed research with a concrete deliverable.
title: "[SPIKE] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations: { required: true }
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: Doc, prototype, decision, or data.
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points
      options: [ "pts:1", "pts:2", "pts:3", "pts:5", "pts:8" ]
    validations: { required: true }
