name: User Story
description: Persona-grounded testable acceptance criterion.
title: "[STORY] "
labels: ["type:user-story"]
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - core
        - platform
        - data
        - shader
        - render
        - geometry
        - physics
        - content
        - tools
        - e2e
        - scripting
        - material
        - vfx
        - animation
        - audio
        - ai
        - networking
        - simulation
    validations: { required: true }
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: [ "phase:mvp", "phase:post-mvp", "phase:long-term" ]
    validations: { required: true }
  - type: dropdown
    id: points
    attributes:
      label: Story Points (Fibonacci)
      options: [ "pts:1", "pts:2", "pts:3", "pts:5", "pts:8" ]
    validations: { required: true }
  - type: input
    id: persona
    attributes:
      label: Persona
      placeholder: "e.g. game developer, engine developer, technical artist"
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: As a `<persona>`, I want `<capability>`, so that `<outcome>`.
      placeholder: "As a game developer, I want ... so that ..."
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria (Gherkin)
      description: One or more Given/When/Then blocks. Each must be exercised by both a manual test and an E2E test.
      placeholder: |
        Given ...
        When ...
        Then ...
      render: gherkin
    validations: { required: true }
  - type: textarea
    id: manual-test
    attributes:
      label: Manual Test Script
      description: Step-by-step actions a human reviewer performs in the editor / runtime to verify acceptance.
      placeholder: |
        1. Open editor with sample-scene.glibre
        2. Drag X onto Y
        3. Observe Z
    validations: { required: true }
  - type: textarea
    id: e2e-test
    attributes:
      label: E2E Test Plan
      description: Path to `.glibre-trace` file (or planned name) that asserts each acceptance criterion via the InputDriver replay harness.
      placeholder: "tests/e2e/<context>/<topic>.glibre-trace + assertions"
    validations: { required: true }
  - type: checkboxes
    id: closure
    attributes:
      label: Closure Checklist (in order)
      description: |
        Story may NOT be closed until every box is checked. E2E test must
        be green before manual testing begins.
      options:
        - label: "E2E test authored and passing in CI"
        - label: "Manual test script reviewed by a second human"
        - label: "Manual test executed; PASS recorded as a comment"
    validations: { required: true }
  - type: input
    id: harmonius
    attributes:
      label: Harmonius Source (optional)
      placeholder: "US-X.Y.Z or path under /docs/user-stories/"
  - type: textarea
    id: notes
    attributes:
      label: Notes / Open Questions
