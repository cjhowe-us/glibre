# Apply with: gh label create -f .github/labels.yml (via a sync action).
# Issue types:
#   tracking    — non-leaf aggregator; no estimate; rolls up
#   user-story  — testable acceptance criterion (leaf for testing)
#   epic        — multi-PR work item under a tracking issue
#   plan        — leaf; closes with exactly one PR
#   spike       — time-boxed research/design; output = doc/decision
- { name: "type:tracking",     color: "5319e7" }
- { name: "type:user-story",   color: "0e8a16" }
- { name: "type:epic",         color: "0366d6" }
- { name: "type:plan",         color: "1d76db" }
- { name: "type:spike",        color: "fbca04" }

- { name: "phase:mvp",         color: "0e8a16" }
- { name: "phase:post-mvp",    color: "fbca04" }
- { name: "phase:long-term",   color: "c5def5" }

- { name: "pts:1",             color: "ededed" }
- { name: "pts:2",             color: "ededed" }
- { name: "pts:3",             color: "ededed" }
- { name: "pts:5",             color: "ededed" }
- { name: "pts:8",             color: "ededed" }

