# XcodeGen spec — wraps CMake/Ninja-built Glibre static libs into iOS +
# macOS .app bundles. Run `xcodegen generate` after building all three
# preset directories (macos-debug, ios-debug, ios-sim-debug).
#
# Pipeline:
#   cmake --preset macos-debug   && cmake --build --preset macos-debug
#   cmake --preset ios-debug     && cmake --build --preset ios-debug
#   cmake --preset ios-sim-debug && cmake --build --preset ios-sim-debug
#   xcodegen generate
#   xcodebuild -project Glibre.xcodeproj -scheme GlibreMacOS  build
#   xcodebuild -project Glibre.xcodeproj -scheme GlibreIOS    -destination 'generic/platform=iOS' build

name: Glibre

options:
  bundleIdPrefix: com.glibre
  createIntermediateGroups: true
  generateEmptyDirectories: true
  deploymentTarget:
    macOS: "26.4"
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++23"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_C_LANGUAGE_STANDARD: c23
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # Apple-Silicon-only baseline (matches CMake presets).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO

targets:
  GlibreMacOS:
    type: application
    platform: macOS
    deploymentTarget: "26.4"
    sources:
      - path: xcodegen/macos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glibre.GlibreMacOS
        INFOPLIST_FILE: xcodegen/macos/Info.plist
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/build/macos-$(CONFIGURATION:lower)
        OTHER_LDFLAGS:
          - $(inherited)
          # Picked up once core/ adds add_library(glibre_runtime …).
          # - -lglibre_runtime
    dependencies:
      - sdk: Cocoa.framework
      # CoreAnimation lives in QuartzCore on Apple platforms.
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework

  GlibreIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: xcodegen/ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glibre.GlibreIOS
        INFOPLIST_FILE: xcodegen/ios/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Per-sdk lib paths — iphoneos vs iphonesimulator.
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - $(SRCROOT)/build/ios-$(CONFIGURATION:lower)
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - $(SRCROOT)/build/ios-sim-$(CONFIGURATION:lower)
        OTHER_LDFLAGS:
          - $(inherited)
          # - -lglibre_runtime
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework

schemes:
  GlibreMacOS:
    build:
      targets:
        GlibreMacOS: all
    run:
      config: Debug
  GlibreIOS:
    build:
      targets:
        GlibreIOS: all
    run:
      config: Debug
